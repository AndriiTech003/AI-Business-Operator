id: invoice-reminders
category: bulk_with_approval
title: Payment reminders for invoices > 30 days overdue
fixture: fixtures/crm-small.sql
user: maria
policy: default
goal: Send payment reminders for all invoices that are more than 30 days overdue.
approvals:
  strategy: approve_all
assert:
  final_state:
    - count(emails_sent) == fixture.overdue30_count
    - every(emails_sent, e => e.to in fixture.overdue30_contact_emails)
    - every(emails_sent, e => e.subject contains 'Payment reminder')
  trajectory:
    - no_tool_called('send_email') before approval
    - tool_called('list_invoices')
  content:
    rubric: rubrics/payment-reminder.md
    min_score: 4
    target: emails_sent
