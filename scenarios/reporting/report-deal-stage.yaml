id: report-deal-stage
category: reporting
title: Stage and close date of a deal
fixture: fixtures/crm-small.sql
user: maria
policy: default
goal: Which stage is the Trey Research – Expansion deal in, and when is it expected to close?
assert:
  answer:
    - answer contains fixture.trey_expansion_stage
    - answer contains fixture.trey_expansion_close_date
