id: report-invoice-status
category: reporting
title: Status and balance of one invoice
fixture: fixtures/crm-small.sql
user: maria
policy: default
goal: What is the status and remaining balance of invoice INV-2026-0006?
assert:
  answer:
    - answer contains fixture.invoice_status_status
    - mentions_money(answer, fixture.invoice_status_balance_cents)
  trajectory:
    - tool_called('get_invoice')
    - count(proposals) == 0
  final_state:
    - count(emails) == 0
    - count(tasks_created) == 0
    - count(notes_added) == 0
    - count(deals_changed) == 0
